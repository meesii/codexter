name: codexter
description: "MCP server for ChatGPT with Codex-style local tools"
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shadcn_flutter: ^0.0.53
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.0
  uuid: ^4.5.1
  collection: ^1.18.0
  path: ^1.9.0
  image: ^4.9.1
  window_manager: ^0.4.3
  ffi: ^2.2.0
  file_selector: ^1.1.0
  flutter_local_notifications: 22.2.0
  tray_manager: 0.5.3
  package_info_plus: ^10.2.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo.png
    - assets/brand/tray_icon.ico
