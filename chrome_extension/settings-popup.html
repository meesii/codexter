<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Codexter</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <main class="panel">
        <header class="hero">
            <div class="brand-mark" aria-hidden="true"><img src="icons/icon-128.png" alt="" draggable="false"></div>
            <div class="hero-copy">
                <div class="brand-row"><strong>Codexter</strong><span class="version" id="version-text"></span></div>
                <div class="hero-sub">ChatGPT 本地增强与长对话优化</div>
            </div>
            <a class="github-link" href="https://github.com/meesii/codexter" target="_blank" rel="noreferrer" aria-label="GitHub" draggable="false">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.48 2 2 6.58 2 12.23c0 4.52 2.87 8.35 6.84 9.7.5.1.68-.22.68-.49 0-.24-.01-1.05-.01-1.9-2.78.62-3.37-1.21-3.37-1.21-.45-1.18-1.11-1.49-1.11-1.49-.91-.64.07-.63.07-.63 1 .08 1.53 1.06 1.53 1.06.9 1.57 2.35 1.12 2.92.86.09-.66.35-1.12.64-1.38-2.22-.26-4.56-1.14-4.56-5.08 0-1.12.39-2.04 1.03-2.76-.1-.26-.45-1.31.1-2.72 0 0 .84-.28 2.75 1.05A9.37 9.37 0 0 1 12 6.9a9.3 9.3 0 0 1 2.5.35c1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.46.1 2.72.64.72 1.03 1.64 1.03 2.76 0 3.95-2.35 4.81-4.58 5.07.36.32.68.95.68 1.92 0 1.39-.01 2.5-.01 2.84 0 .27.18.59.69.49A10.22 10.22 0 0 0 22 12.23C22 6.58 17.52 2 12 2Z"/></svg>
            </a>
        </header>

        <nav class="tabs" aria-label="设置分类">
            <button class="tab-button is-active" type="button" data-tab="connection">连接</button>
            <button class="tab-button" type="button" data-tab="optimization">长对话优化</button>
        </nav>

        <section class="tab-page is-active" data-page="connection">
            <div class="status-bar">
                <div class="status-main">
                    <span class="status-dot" id="bridge-dot"></span>
                    <div><div class="status-title" id="bridge-text">正在读取状态…</div><div class="status-meta" id="cache-summary">等待缓存</div></div>
                </div>
                <button class="refresh-button" id="refresh-cache" type="button" title="重新拉取插件映射和当前会话">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5M18.2 9A7 7 0 0 0 6.5 6.5L4 9m16 6-2.5 2.5A7 7 0 0 1 5.8 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
            </div>

            <section class="data-section">
                <div class="section-heading"><span>插件映射</span><span class="count-badge" id="connector-count">0</span></div>
                <div class="data-list" id="connector-list"></div>
            </section>

            <section class="data-section">
                <div class="section-heading"><span>会话关联</span><span class="count-badge" id="conversation-count">0</span></div>
                <div class="data-list conversation-list" id="conversation-list"></div>
            </section>
        </section>

        <section class="tab-page" data-page="optimization">
            <section class="option-card">
                <div class="option-row">
                    <div class="option-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M6 7h12M8 4h8M8 10v8h8v-8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
                    <div class="option-copy"><div class="option-title">精简历史过程</div><div class="option-desc">仅保留问题和最终回复，移除思考与工具过程</div></div>
                    <label class="switch" aria-label="精简历史过程"><input id="history-trim" type="checkbox"><span class="slider"></span></label>
                </div>
            </section>

            <section class="option-card featured">
                <div class="option-row">
                    <div class="option-icon featured-icon"><svg viewBox="0 0 24 24" fill="none"><rect x="5" y="5" width="14" height="5" rx="2" stroke="currentColor" stroke-width="1.8"/><rect x="5" y="14" width="14" height="5" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 10v4M16 10v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="compat-dot" id="virtual-status" title="等待检测" aria-label="等待检测"></span></div>
                    <div class="option-copy"><div class="title-line"><span class="option-title">增强原生虚拟化</span><span class="recommend">推荐</span></div><div class="option-desc">减少历史回复常驻，滚到附近时自动恢复</div></div>
                    <label class="switch" aria-label="增强原生虚拟化"><input id="native-virtual" type="checkbox"><span class="slider"></span></label>
                </div>
            </section>
        </section>
    </main>
    <script src="popup.js"></script>
</body>
</html>
